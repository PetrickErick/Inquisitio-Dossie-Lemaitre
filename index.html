.hd{display:flex;gap:14px;align-items:center;margin:14px 0 10px}.ib{width:54px;height:54px;border-radius:50%;background:var(--pn2);color:var(--bl);display:grid;place-items:center;flex:none}.ib svg{width:28px;height:28px}.hd h2{margin:0}.lk{color:var(--bl);border-bottom:1px dotted var(--bl);cursor:pointer}.fc{text-align:center;padding:22px 16px}.chips a{color:inherit}
footer{padding:24px 20px 100px;text-align:center;color:var(--mut);font-size:.8rem} .lk{font:inherit;padding:0;border:0;border-bottom:1px dotted var(--bl);border-radius:0;background:transparent;color:var(--bl);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px} .portrait{transition:transform .2s, color .2s}.card:hover .portrait,.card:focus-within .portrait{transform:rotate(-3deg) scale(1.06);color:var(--ac)} .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))} .pg{overflow-wrap:anywhere} a{color:var(--bl)} .search-label{display:block;margin-top:12px} #status{color:var(--ac)} @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}} @media(max-width:760px){nav button{flex:0 0 76px} main{padding-left:14px;padding-right:14px}}</style></head><body><div class="app"><aside><div class="brand">Inquisitio<small>Dossiê Lemaître · 5.0</small></div><nav id="nav" aria-label="Seções do dossiê"></nav></aside><div class="c"><div class="tipbar"><span id="tip">Estudo histórico · Rouen, 1431</span><button id="th" onclick="th(S.th==='dark'?'light':'dark')">Tema</button></div><p id="status" role="status"></p><main id="m"></main><footer>Projeto independente · Autoria: Erick Petrick · Versão 5.0<br>Créditos das fontes e da tradução em Guia → Fontes e em Escrituras.</footer></div></div><script>const DATA={"G":{"d":["Quem foi Joana d’Arc\n\nJoana nasceu por volta de 1412 em Domrémy, vila camponesa do nordeste da França; a data exata é desconhecida. Era filha de Jacques d’Arc e Isabelle Romée, não aprendeu a ler nem a escrever e cresceu entre as tarefas da casa e do campo. Contou no julgamento que, aos treze anos, teve a primeira visão, de São Miguel, e depois de Santa Margarida e Santa Catarina. A região vivia em guerra: Domrémy foi atacada em 1425 e incendiada em 1428. Joana passou a se apresentar como “a Donzela” (la Pucelle), nome que enfatizava sua virgindade.","A França dividida\n\nA Guerra dos Cem Anos começou em 1337, por disputas de território e pelo direito inglês ao trono francês. No início do século XV, o rei Carlos VI sofria crises de doença mental e a nobreza se partiu: os Armagnacs, ligados ao herdeiro Carlos (o delfim), e os borguinhões, liderados pelo duque da Borgonha, que depois se aliou aos ingleses. Henrique V da Inglaterra invadiu em 1415. Pelo Tratado de Troyes (1420), o delfim foi deserdado e o trono ficou prometido aos herdeiros de Henrique V. Em 1422 morreram Henrique V e Carlos VI; o bebê Henrique VI virou rei nominal das duas coroas, mas o delfim continuou reivindicando o trono.","A missão e o encontro com o delfim\n\nEm 1428, Joana pediu a Robert de Baudricourt, em Vaucouleurs, uma escolta até Chinon e foi recusada. Na terceira tentativa, em fevereiro de 1429, partiu vestida de homem, com poucos acompanhantes. Encontrou Carlos entre o fim de fevereiro e o início de março; tinha 17 anos. Para testá-la, o delfim a enviou a Poitiers, onde teólogos a acharam uma boa católica, mas não decidiram a origem de suas visões e sugeriram verificar a promessa dela em Orléans. Em Tours, mulheres confirmaram sua virgindade. Ela recebeu armadura, um estandarte desenhado por ela e uma espada trazida de Sainte-Catherine-de-Fierbois.","Orléans e a campanha do Loire\n\nOs ingleses cercavam Orléans desde outubro de 1428. Joana chegou em 29 de abril de 1429. Entre 4 e 7 de maio, os franceses tomaram as fortificações inglesas de Saint-Loup, dos Augustins e de Tourelles, e ela foi ferida por uma flecha em 7 de maio. Em 8 de maio, os ingleses levantaram o cerco. Em junho vieram Jargeau, Meung-sur-Loire, Beaugency e a vitória de Patay. Muitos viram em Orléans o sinal que Joana prometera em Poitiers; os ingleses, ao contrário, atribuíram a derrota a uma influência do diabo.","Reims, a coroação e o declínio\n\nPartindo de Gien em 29 de junho, o exército avançou quase sem resistência, e só Troyes resistiu por alguns dias. Reims abriu as portas em 16 de julho, e Carlos VII foi sagrado em 17 de julho de 1429, com Joana em lugar de honra. O ataque a Paris, em 8 de setembro, fracassou e ela foi ferida na perna. O rei mandou encerrar o ataque e dissolveu o exército. Acadêmicos da Universidade de Paris disseram que o fracasso provava que a inspiração dela não era divina. Cercos posteriores, como o de La-Charité, também falharam.","A captura e a venda\n\nEm 1430, Joana partiu para socorrer Compiègne, cercada pelos borguinhões. Em 23 de maio, foi capturada durante uma saída contra o acampamento de Margny. Levada ao castelo de Beaurevoir, tentou fugir saltando de uma torre e sobreviveu. Os ingleses negociaram sua compra com papel importante do bispo Pierre Cauchon; as fontes falam em 10.000 libras tournois (a Britannica diz francos). Em 3 de janeiro de 1431, ela estava nas mãos do bispo, e o julgamento foi marcado para Rouen, principal base inglesa na França. Não há evidência de que Carlos VII tenha tentado resgatá-la.","O tribunal de Rouen\n\nO processo era eclesiástico, mas politicamente motivado. Cauchon, bispo de Beauvais, aliado dos borguinhões e da coroa inglesa, presidiu; como Rouen não era sua diocese, o Capítulo da catedral lhe cedeu o território para o caso. Jean Lemaître representava o Inquisidor da França e, segundo uma testemunha do processo de reabilitação, precisou ser pressionado a comparecer. Cerca de 131 clérigos participaram, muitos ligados à Universidade de Paris e favoráveis aos ingleses, que financiaram o julgamento. Cauchon tentou seguir o rito inquisitorial, mas críticos apontam falhas: Joana ficou em prisão civil, vigiada por soldados, sem assistência jurídica e só soube das acusações bem depois.\n\nJurisdição: o poder de julgar envolve competência territorial, delegação inquisitorial e imparcialidade. Uma autorização formal não responde, sozinha, às objeções de coação e defesa insuficiente.","Interrogatórios e acusações\n\nOs interrogatórios começaram em fevereiro de 1431. Os juízes queriam saber de onde vinham as vozes (era o chamado discernimento dos espíritos), por que ela usava roupas masculinas e por que não submetia seus atos à Igreja. Perguntaram, por exemplo, se ela estava na graça de Deus: como a Igreja ensinava que ninguém pode ter certeza disso, qualquer resposta direta a comprometeria. Joana disse esperar estar e, se não estivesse, que Deus a pusesse nessa graça, o que surpreendeu os juízes. Em março foram lidos 70 artigos do promotor, depois resumidos em 12 e aprovados pela Universidade de Paris. Mostraram-lhe os instrumentos de tortura, mas a maioria dos assessores votou contra usá-los.","Abjuração, relapsia e fogueira\n\nEm 24 de maio, no cemitério de Saint-Ouen, Joana aceitou se submeter e assinou um documento de abjuração, que previa deixar as armas e as roupas masculinas. Continuou presa e acorrentada, não em cárcere da Igreja. Em 28 de maio, voltou a vestir roupas de homem; segundo o registro, disse que era mais apropriado diante dos guardas e que as promessas feitas a ela não foram cumpridas. Disse também que as vozes a repreenderam por ter abjurado por medo. Em 29 de maio, foi declarada herege relapsa e entregue ao poder secular. Em 30 de maio de 1431, aos cerca de 19 anos, foi queimada na praça do Mercado Velho, em Rouen.\n\nAbjuração e relapsia: devem ser examinadas separadamente a fórmula registrada, a compreensão de Joana e as circunstâncias da retomada das roupas. Os testemunhos posteriores discutem pressão e condições carcerárias; a acusação não pode tratar o retorno das vestes como prova autossuficiente.","Reabilitação e legado\n\nA condenação ameaçava a legitimidade da coroa de Carlos VII, que em 1450 mandou abrir um inquérito. Em 1452, o cardeal d’Estouteville e o inquisidor Jean Bréhal ouviram testemunhas. O processo de reabilitação começou em 7 de novembro de 1455, com o pedido de Isabelle Romée, mãe de Joana, e terminou em 7 de julho de 1456: a sentença de 1431 foi anulada por vícios de procedimento e fraude, sem declarar as visões autênticas. Em 1435, os borguinhões abandonaram os ingleses no Tratado de Arras, e a guerra terminou em 1453. Joana foi beatificada em 1909, canonizada em 16 de maio de 1920 e é uma das padroeiras da França.","Pontos de debate para a simulação\n\nEstes são os temas que mais tendem a aparecer: (1) a jurisdição de Cauchon e a influência inglesa; (2) a prisão civil e a ausência de defensor; (3) se as vozes eram divinas ou ilusão, e quem tem autoridade para decidir; (4) a roupa masculina como violação de regra da Igreja ou como necessidade; (5) a validade da abjuração e da relapsia; (6) o uso político do julgamento, pois condenar Joana enfraquecia Carlos VII. Lembre que a reabilitação de 1456 anulou a sentença, mas não declarou as visões verdadeiras.\n\nMétodo: distinguir o que está nos autos de 1431 do que testemunhas relataram décadas depois. Comparar versões e identificar a fonte evita atribuir a um depoimento posterior o valor de registro contemporâneo."],"s":[["Quem foi Joana d’Arc",0],["A França dividida",1],["A missão e o encontro com o delfim",2],["Orléans e a campanha do Loire",3],["Reims, a coroação e o declínio",4],["A captura e a venda",5],["O tribunal de Rouen",6],["Interrogatórios e acusações",7],["Abjuração, relapsia e fogueira",8],["Reabilitação e legado",9],["Pontos de debate para a simulação",10]]},"ART":[["Aparições e vozes","Joana dizia ver e ouvir São Miguel, Santa Catarina e Santa Margarida, e que essas vozes guiavam seus atos.","A Igreja precisava checar se as vozes vinham de Deus ou do demônio. Ninguém aprovou essas visões; sem prova, são suspeitas.","Diz que realmente via e ouvia os santos."],["Missão de ajudar o delfim","As vozes teriam mandado Joana sair de casa e ajudar o delfim Carlos (o herdeiro do trono francês).","Dizer que Deus deu uma missão política e militar é se colocar acima das autoridades da Igreja e do reino.","Diz que cumpria uma missão recebida de Deus."],["Coroação e expulsão dos ingleses","Joana dizia que as vozes mandaram coroar Carlos VII e prometeram expulsar os ingleses.","Profecia sobre política pode ser falsa revelação. Havia falsos profetas na época.","Diz que as previsões vinham de Deus."],["Conhecer o futuro","Joana dizia saber o que aconteceria e que suas previsões se cumpririam.","Prever o futuro sem origem divina comprovada é adivinhação, condenada pela Igreja.","Defende que suas revelações são autênticas."],["Vitórias como obra de Deus","Joana atribuía suas vitórias militares à intervenção de Deus.","Vencer não prova aprovação divina. Depois de Azincourt (1415), muitos viam Deus ao lado dos ingleses; a lógica seria a mesma.","Diz que Deus determinou sua missão."],["Certeza da vitória e da salvação","Joana dizia que as vozes lhe garantiam a vitória e a salvação.","Ter certeza absoluta sobre uma revelação particular é presunção.","Mantém a confiança nas vozes."],["Roupas masculinas","Joana usava roupas e equipamentos de homem.","A Igreja proibia misturar as vestes dos sexos (Dt 22,5). O uso foi persistente e deliberado.","Diz que as roupas faziam parte da missão e eram necessárias."],["Cabelo e aparência","Ela cortou o cabelo e adotou aparência masculina.","Mesma proibição das roupas; foi escolha, não acidente.","Diz que fazia parte da missão."],["Armas e combate","Joana carregou armas e acompanhou tropas em batalha.","Combater não combina com a imagem de enviada de Deus e reforça as outras acusações.","Diz que cumpria a missão dada por Deus."],["Deus acima da Igreja","Joana dizia que seus atos vinham de Deus e dos santos e que obedecia primeiro a Deus.","Se cada um segue suas próprias revelações, a autoridade da Igreja deixa de valer (Mt 18,15-17).","Diz que deve obedecer primeiro a Deus."],["Recusa de se submeter à Igreja","Joana não aceitou submeter totalmente seus atos e palavras ao julgamento da Igreja.","A Igreja na terra (Ecclesia militans) é a última instância; recusar é desobedecer.","Reconhece a Igreja, mas insiste em obedecer a Deus primeiro."],["Resumo: erro, superstição e heresia","Reúne as acusações anteriores e as compara com a Bíblia, decisões da Igreja e doutores aprovados.","As acusações formam um padrão: vozes, missão, roupas e desobediência. A abjuração (24/05) e a volta às roupas (28/05) mostram persistência.","Mantém o que disse sobre vozes, missão e roupas."]],"CA":[["Joana foi examinada em Poitiers por teólogos, que a acharam uma boa católica.","Poitiers não decidiu a origem das vozes; só sugeriu testar a promessa dela em Orléans."],["Circulavam profecias sobre uma virgem que salvaria a França, o que dava sentido à missão.","Profecia popular não é aprovação da Igreja; qualquer pessoa poderia se apresentar como a virgem prometida."],["A coroação em Reims aconteceu, como ela havia dito.","Cumprir um plano político não prova origem divina; Carlos já tinha exército e corte."],["Joana nunca fez adivinhação; repetia o que dizia ouvir de Deus.","Dizer que ouve Deus é justamente o que precisa ser verificado; sem verificação, equivale a adivinhar."],["Orléans foi libertada logo após a chegada dela, o sinal pedido em Poitiers.","O sinal foi lido por interessados: os ingleses o atribuíram ao diabo. Um mesmo fato não decide."],["Perguntada sobre a graça de Deus, ela respondeu com humildade e evitou a armadilha.","Mostra habilidade, mas ela seguiu afirmando confiança total nas vozes e na vitória."],["Usava roupas masculinas por necessidade: viajava entre soldados e depois ficou presa sob guarda de homens.","A abjuração a obrigou a largar essas roupas, e ela assinou. A necessidade alegada não apaga o compromisso."],["Cortar o cabelo foi uma escolha prática para a vida militar.","Praticidade não elimina a regra, e a escolha foi mantida por muito tempo."],["Joana não lutava: carregava o estandarte e animava as tropas.","Estar à frente de tropas armadas já contraria a condição que ela alegava; o estandarte era símbolo de comando."],["Ela nunca negou a Igreja, só disse que devia obedecer a Deus primeiro.","Quem decide o que é vontade de Deus é a Igreja; se cada um decide por si, a autoridade desaparece."],["Ela pediu para ser enviada ao papa (confira em Apelo ao Papa, no guia da organização).","Submeter-se só ao papa e recusar os juízes presentes é submissão condicional, não obediência."],["O processo foi viciado: prisão civil, sem defensor, juízes sob pressão inglesa.","Reconheça as falhas, mas separe procedimento de mérito: a agenda temática julga o que Joana declarou nos autos."]],"ARG":[["Por que chamar Joana de herege ou bruxa importa","Se os atos dela forem milagres, a vitória francesa é abençoada por Deus. Se forem feitiçaria, o trono de Carlos VII nasceu do demônio. Por isso o enquadramento é uma arma política: condenar Joana enfraquece a coroação de Carlos VII e favorece os ingleses.","Exame dos espíritos não equivale a prova de falsidade; o texto pede discernimento."],["Examinar as vozes","A acusação pode exigir critérios de discernimento das revelações. Isso não demonstra, por si, que as vozes fossem falsas ou que nenhum exame favorável tivesse ocorrido em Poitiers.","Exame dos espíritos não equivale a prova de falsidade; o texto pede discernimento."],["Roupas de homem","A acusação pode invocar Dt 22,5 e a retomada das roupas masculinas. A defesa deve ser considerada: necessidade, condições de prisão e proteção contra violência.","A discussão medieval incluía necessidade e proteção da integridade física; o versículo isolado não resolve o caso."],["Obedecer só a Deus é desobedecer à Igreja","Joana diz que obedece primeiro a Deus. Mas é a Igreja que decide o que vem de Deus. Se cada pessoa seguir suas próprias revelações, a autoridade da Igreja acaba (Mt 18,15-17).","Trata de correção comunitária; não legitima por si só qualquer tribunal específico."],["Vencer batalhas não prova que Deus aprovou","Depois de Azincourt (1415), muita gente via Deus ao lado dos ingleses. Pela mesma lógica, vitória militar não prova que a missão veio de Deus.","É preciso demonstrar o teor e as condições da previsão; uma derrota militar isolada não basta."],["Falsos profetas existiam","A presença de outros relatos de revelação torna o discernimento um tema de debate. No interrogatório, Joana descreveu sua discordância de Catarina de la Rochelle; não se deve transformar isso em diagnóstico histórico de fraude.","A advertência exige avaliação dos frutos e não demonstra que Joana fosse falsa profetisa."],["Abjuração e relapsia","Em 24/05 Joana abjurou, isto é, renunciou aos seus erros. Em 28/05 voltou às roupas masculinas e em 29/05 foi condenada como relapsa (quem volta ao erro depois de abjurar).","A passagem trata de advertência e afastamento, não prescreve execução nem comprova relapsia no caso de Joana."],["O tribunal tinha autoridade","A acusação pode apontar a autorização territorial e a delegação inquisitorial. Esses atos não resolvem as objeções sobre imparcialidade, defesa e condução do processo.","Trata de correção comunitária; não legitima por si só qualquer tribunal específico."],["Processo longo e registrado","Foram meses de interrogatórios (janeiro a maio de 1431), com notários anotando tudo. Os 70 artigos foram lidos em março e depois resumidos em 12.","Liderança implica prestação de contas; obediência não elimina o exame da conduta do tribunal."],["Resposta à Defesa: o tribunal era dos ingleses","Há registros e procedimentos eclesiásticos no julgamento. Sua existência não prova regularidade nem afasta interesses políticos; é necessário avaliar cada objeção processual.","Liderança implica prestação de contas; obediência não elimina o exame da conduta do tribunal."],["Resposta à Defesa: Joana estava sozinha","Houve interrogatórios, advertências e abjuração. Sua validade depende também de compreensão, liberdade de decisão e condições de custódia.","A passagem trata de advertência e afastamento, não prescreve execução nem comprova relapsia no caso de Joana."]],"FIG":[["Pierre Cauchon","Bispo de Beauvais, presidente do tribunal","d","",1,"Na história conduziu o julgamento e era ligado aos ingleses.","conhece o caso a fundo e domina a linha de acusação.","sua ligação com os ingleses é o principal alvo da Defesa.","bishop"],["Jean d’Estivet","Promotor","d","",1,"Escreveu as acusações: 70 artigos, depois resumidos em 12.","seus artigos são a base da agenda temática.","a Defesa pode dizer que os artigos distorceram as falas de Joana.","cleric"],["Thomas de Courcelles","Teólogo da Universidade de Paris","d","",1,"Teólogo e assessor. O registro de 12 de maio de 1431 o inclui entre os favoráveis à tortura; a maioria se opôs. Participou da redação latina dos autos.","Permite discutir responsabilidade dos assessores.","A versão anterior invertia seu voto sobre tortura.","cleric"],["Isambard de la Pierre","Frade dominicano, assessor","d","",0,"Segundo testemunhos posteriores, aconselhou Joana e esteve com ela nos últimos momentos; sofreu ameaças.","conhece as provas e a agenda temática.","sua simpatia por Joana pode enfraquecer a Acusação se ele depuser.","monk"],["Martin Ladvenu","Frade dominicano, confessor de Joana","d","",0,"Confessou Joana, lhe deu a comunhão e a acompanhou até a fogueira.","pode mostrar que ela recebeu os sacramentos.","tende a falar com compaixão por ela.","monk"],["Jean de la Fontaine","Comissário do processo","d","",0,"Comissário encarregado de interrogatórios em março de 1431. Relatos posteriores e interpretações divergem sobre sua saída de Rouen.","Ajuda a examinar a condução das perguntas.","Não apresentar como fato incontroverso uma fuga por simpatia a Joana.","scribe"],["Jean Lohier","Jurista","d","",-1,"Jurista consultado. Manchon recordou suas objeções ao processo, incluindo a falta de aconselhamento à acusada.","Importante para discutir garantias processuais.","Conhecemos essas objeções sobretudo por testemunhos retrospectivos.","jurist"],["Nicolas de Houppeville","Teólogo","d","",-1,"Teólogo que contestou a competência dos julgadores. Seu testemunho posterior relata prisão após a oposição.","Oferece uma crítica de dentro do meio eclesiástico.","As versões sobre ameaças e coerção precisam ser comparadas, não fundidas.","jurist"],["Jean Lemaître","Vice-inquisidor da França","d","",1,"Dominicano e vice-inquisidor, atuou como co-juiz após a discussão de sua competência e a delegação inquisitorial. Testemunhos posteriores relatam pressão para sua participação.","é a autoridade da Inquisição no caso.","o vínculo com o aparato inglês pode ser explorado contra você.","monk"],["Jean Bréhal","Inquisidor-Geral da França em 1456","d","",-1,"Inquisidor que participou da revisão e elaborou uma análise crítica do processo. A anulação foi pronunciada pelo tribunal de revisão em 7 de julho de 1456, não por Bréhal sozinho.","conhecer os erros que ele apontou ajuda a preparar respostas.","seu relatório lista irregularidades (coação, prisão civil, juízes parciais).","cleric"],["Guillaume d’Estouteville","Cardeal, legado do papa","d","",-1,"Em 1452 abriu o inquérito inicial que levou à reabilitação.","mostra que a revisão veio de dentro da Igreja.","representa a autoridade que depois desfez a sentença.","cardinal"],["Guillaume Manchon","Notário principal","d","",0,"Registrou os interrogatórios. Anos depois criticou o processo.","suas atas são a prova oficial e podem ser citadas.","seu depoimento posterior critica o julgamento.","scribe"],["Jean Massieu","Oficial de justiça","d","",-1,"Levava Joana ao tribunal e acompanhava o cotidiano dela na prisão.","sabe como eram os procedimentos.","seu relato pode mostrar duras condições de prisão.","scribe"],["Joana d’Arc","A Ré, 19 anos","o","",-1,"Camponesa que liderou tropas na Guerra dos Cem Anos. Acusada de heresia, blasfêmia, idolatria e de usar roupas masculinas.","suas próprias respostas sobre as vozes e as roupas sustentam a acusação.","sua firmeza e simplicidade comovem juízes e júri.","joan"],["Cardeal Henrique Beaufort","Bispo de Winchester","o","",1,"Representa a alta nobreza e o poder inglês; esteve presente nos momentos decisivos.","reforça o peso político contra Joana.","sua presença prova a influência inglesa.","cardinal"],["Jean de Luxemburgo","Líder borguinhão","o","",1,"Joana foi capturada por tropas do partido borguinhão, vinculadas a Jean de Luxemburgo, em 23 de maio de 1430. Depois foi transferida aos ingleses mediante pagamento.","explica como ela chegou às mãos dos ingleses.","a venda ao inimigo sugere interesse político, não religioso.","knight"],["Henrique VI","Rei da França e da Inglaterra (pelo Tratado de Troyes)","o","",1,"Pela dupla monarquia, era o rei que Joana combatia.","o processo protege sua coroa.","a Defesa dirá que o julgamento serviu a ele.","king"],["Guillaume Erard","Pregador","o","",1,"Pregou no cemitério de Saint-Ouen em 24/05/1431, dia da abjuração.","seu sermão é marco da abjuração.","pode ser lido como pressão pública.","cleric"],["Catarina de la Rochelle","Visionária mencionada por Joana","o","",1,"Nos interrogatórios, Joana relatou ter rejeitado as alegações de Catarina. Isso registra a avaliação de Joana, não comprova todas as ações atribuídas a Catarina.","Contrasta diferentes reivindicações de revelação.","Evitar a classificação categórica de falsa profetisa e a afirmação não comprovada de testemunho contra Joana.","veil"],["Carlos VII","Rei da França","o","",0,"Coroado em Reims com a ajuda de Joana. Não interveio durante o cativeiro e apoiou a anulação depois.","se Joana for bruxa, sua coroa fica manchada.","seu abandono pode causar simpatia por Joana.","king"],["Papa Calisto III","Pontífice","o","",-1,"Autorizou a revisão do julgamento a pedido da família de Joana.","mostra que a Igreja reviu o caso.","sua autoridade anulou a sentença.","pope"],["Isabelle Romée e irmãos","Mãe e irmãos de Joana","o","",-1,"Lideraram o esforço jurídico para limpar o nome dela.","a Acusação pode apontar que o caso só foi revisto décadas depois.","o apelo de uma mãe tem forte peso emocional.","veil"]],"DIC":[["Vozes","Conceitos","Mensagens e aparições que Joana atribuía principalmente a São Miguel, Santa Catarina e Santa Margarida. A origem dessas experiências foi discutida no julgamento."],["Heresia","Conceitos","Ideia ou prática que contraria a fé oficial da Igreja. Era o crime central do julgamento."],["Jurisdição","Conceitos","O direito de julgar um caso em certo lugar. A Defesa pode questionar se Cauchon podia julgar em Rouen."],["Abjuração","Conceitos","Renúncia pública aos próprios erros. Joana abjurou em 24 de maio de 1431, no cemitério de Saint-Ouen."],["Relapsa","Conceitos","Pessoa considerada reincidente em heresia após abjuração. Em 1431, a retomada das roupas e das afirmações sobre as vozes integrou a acusação de relapsia; sua validade foi contestada na revisão."],["Inquisição","Conceitos","Tribunal da Igreja que investigava heresia. Lemaître era seu representante (vice-inquisidor). Também se diz Santo Ofício."],["Inquisitio","Conceitos","Investigação judicial conduzida pela autoridade competente; no contexto medieval, designa um modo de procedimento, não uma instituição moderna."],["Ecclesia militans","Conceitos","“Igreja militante”: a Igreja na terra, com papa e prelados. A Acusação diz que Joana devia se submeter a ela."],["Delfim","Conceitos","Título do herdeiro do trono francês. Carlos era o delfim até ser coroado Carlos VII."],["Cisma","Conceitos","Rompimento com a unidade da Igreja. Recusar a autoridade dela pode ser visto assim."],["Idolatria","Conceitos","Adorar algo no lugar de Deus. Estava entre as acusações contra Joana."],["Blasfêmia","Conceitos","Ofender Deus ou as coisas sagradas. Também estava entre as acusações."],["Superstição","Conceitos","Crença religiosa tida como falsa. Aparece como possível origem das vozes."],["Libellus","Conceitos","Pequeno escrito ou peça formal de um procedimento jurídico. Seu sentido depende do documento e do contexto."],["Sentença","Conceitos","A decisão final do tribunal. A de 1431 condenou Joana; a de 1456 anulou essa condenação."],["Notário","Conceitos","Escrivão oficial que registra tudo. Manchon e Boisguillaume anotaram o processo."],["Escritura","Conceitos","A Bíblia, base dos argumentos religiosos do julgamento."],["Cauchon","Pessoas","Pierre Cauchon, bispo de Beauvais. Presidiu o tribunal e era aliado dos ingleses."],["Carlos VII","Pessoas","Rei da França coroado em Reims em 17 de julho de 1429. A ausência de um resgate bem-sucedido não permite afirmar com certeza tudo o que fez ou deixou de fazer por Joana."],["Henrique VI","Pessoas","Rei da Inglaterra e, pelo Tratado de Troyes, também da França. Era criança em 1431."],["Armagnacs","Pessoas","Franceses que apoiavam o delfim Carlos contra os ingleses."],["Borguinhões","Pessoas","Franceses da Borgonha, aliados dos ingleses. Capturaram Joana em Compiègne."],["Compiègne","Lugares","Cidade onde Joana foi capturada pelos borguinhões em 23 de maio de 1430."],["Rouen","Lugares","Cidade sob domínio inglês onde Joana foi julgada e morreu, em 1431."],["Orléans","Lugares","Cidade cujo cerco inglês Joana ajudou a romper (8 de maio de 1429), sua primeira grande vitória."],["Reims","Lugares","Cidade tradicional das coroações francesas. Carlos VII foi coroado ali em 17 de julho de 1429."],["Domrémy","Lugares","Vila camponesa onde Joana nasceu, em 1412."],["Beauvais","Lugares","Diocese do bispo Cauchon."],["Troyes","Eventos","Tratado de Troyes (1420): tirou o direito do delfim Carlos ao trono e reconheceu o rei inglês como herdeiro da França."],["Guerra dos Cem Anos","Eventos","Conflito entre França e Inglaterra de 1337 a 1453. O julgamento de Joana acontece no meio dele."],["Azincourt","Eventos","Batalha de 1415 vencida pelos ingleses. Serve ao argumento de que vitória não prova aprovação divina."],["Reabilitação","Eventos","Novo processo (1456) que anulou a condenação de 1431, a pedido da família de Joana."]],"BIB":[["Vozes e visões","1 Jo 4,1","1 Amados, não creiais em todo espírito, mas provai se os espíritos são da parte de Deus; porque muitos falsos profetas têm vindo ao mundo.","Justifica examinar as vozes de Joana: provar antes de crer era um dever.","1 a 4","https://ebible.org/pdf/porbr2018/porbr2018_1JN.pdf#page=7","Exame dos espíritos não equivale a prova de falsidade; o texto pede discernimento."],["Vozes e visões","2 Cor 11,14","14 E isto não é algo maravilhoso; porque o mesmo Satanás se transforma fingindo ser anjo de luz.","Uma aparição bonita pode enganar; por isso a Igreja precisava verificar.","1 e 6","https://ebible.org/porbr2018/2CO11.htm","Paulo discute falsos apóstolos. A aplicação às visões de Joana é uma analogia, não identificação documental."],["Vozes e visões","Gl 1,8","8 Porém, ainda que nós mesmos, ou um anjo do céu vos anuncie outro evangelho além do que já vos anunciamos, maldito seja.","Aparição não vale mais que a doutrina da Igreja.","1 e 10","https://ebible.org/porbr2018/GAL01.htm","O critério é o evangelho anunciado, não a simples discordância com qualquer autoridade."],["Vozes e visões","Mt 7,15","15 Tende cuidado, porém, com os falsos profetas, que vêm a vós com roupa de ovelhas, mas por dentro são lobos vorazes.","Profecias políticas exigem cautela.","3 e 4","https://ebible.org/porbr2018/MAT07.htm","A advertência exige avaliação dos frutos e não demonstra que Joana fosse falsa profetisa."],["Vozes e visões","Dt 18,20-22","20 Porém o profeta que presumir falar palavra em meu nome, que eu não lhe tenha mandado falar, ou que falar em nome de deuses alheios, o tal profeta morrerá.\n21 E se disseres em teu coração: Como conheceremos a palavra que o SENHOR não houver falado?\n22 Quando o profeta falar em nome do SENHOR, e não for a tal coisa, nem vier, é palavra que o SENHOR não falou: com soberba a falou aquele profeta: não tenhas medo dele.","Teste de profecia: a Defesa citará as vitórias; você pode lembrar o fracasso em Paris (8/09/1429) e a captura em Compiègne.","3, 4 e 6","https://ebible.org/pdf/porbr2018/porbr2018_DEU.pdf#page=55","É preciso demonstrar o teor e as condições da previsão; uma derrota militar isolada não basta."],["Vozes e visões","Dt 18,10-12","10 Não seja achado em ti quem faça passar seu filho ou sua filha pelo fogo, nem praticante de adivinhações, nem agoureiro, nem interpretador de presságios, nem feiticeiro,\n11 Nem quem fale encantamentos, nem quem pergunte a espírito, nem mágico, nem quem pergunte aos mortos.\n12 Porque é abominação ao SENHOR qualquer um que faz estas coisas, e por estas abominações o SENHOR teu Deus as expulsou de diante de ti.","Base para acusar de adivinhação e superstição.","4","https://ebible.org/pdf/porbr2018/porbr2018_DEU.pdf#page=54","As práticas enumeradas não podem ser automaticamente equiparadas às experiências relatadas por Joana."],["Roupas","Dt 22,5","5 Não vestirá a mulher roupa de homem, nem o homem vestirá roupa de mulher; porque abominação é ao SENHOR teu Deus qualquer um que isto faz.","Base direta dos artigos sobre roupas e aparência.","7 e 8","https://ebible.org/pdf/porbr2018/porbr2018_DEU.pdf#page=63","A discussão medieval incluía necessidade e proteção da integridade física; o versículo isolado não resolve o caso."],["Autoridade da Igreja","Mt 18,15-17","15 Porém, se teu irmão pecar contra ti, vai repreendê-lo entre ti e ele só; se te ouvir, ganhaste o teu irmão.\n16 Mas se não ouvir, toma ainda contigo um ou dois, para que toda palavra se confirme pela boca de duas ou três testemunhas.\n17 E se não lhes der ouvidos, comunica à igreja; e se também não der ouvidos à igreja, considera-o como gentio e publicano.","Joana recusou ouvir a Igreja.","10 e 11","https://ebible.org/porbr2018/MAT18.htm","Trata de correção comunitária; não legitima por si só qualquer tribunal específico."],["Autoridade da Igreja","Mt 16,18-19","18 E eu também te digo que tu és Pedro, e sobre esta pedra edificarei a minha igreja; e as portas do Xeol não prevalecerão contra ela.\n19 E a ti darei as chaves do Reino dos céus; e tudo o que ligares na terra terá sido ligado nos céus; e tudo o que desligares na terra terá sido desligado nos céus.","A Igreja tem autoridade para julgar a fé.","10 a 12","https://ebible.org/porbr2018/MAT16.htm","As interpretações sobre Pedro e autoridade eclesial variam entre tradições cristãs."],["Autoridade da Igreja","Lc 10,16","16 Quem vos ouve, ouve a mim; e quem vos rejeita, rejeita a mim; e quem me rejeita, rejeita aquele que me enviou.","Rejeitar a Igreja é rejeitar Deus.","11","https://ebible.org/porbr2018/LUK10.htm","O contexto é o envio dos discípulos. A identificação com os juízes de Rouen precisa de argumento adicional."],["Autoridade da Igreja","Hb 13,17","17 Obedecei aos vossos líderes, e sede submissos a eles, pois eles vigiam pelas vossas almas, como os que prestarão contas delas; para que o façam com alegria, e não gemendo, porque isso não vos seria proveitoso.","Dever de obediência aos pastores.","10 e 11","https://ebible.org/porbr2018/HEB13.htm","Liderança implica prestação de contas; obediência não elimina o exame da conduta do tribunal."],["Autoridade da Igreja","1 Sm 15,23","23 Porque como pecado de adivinhação é a rebelião, e como ídolos e idolatria o infringir. Porquanto tu rejeitaste a palavra do SENHOR, ele também te rejeitou para que não sejas rei.","Liga desobediência e adivinhação, duas acusações da temas de estudo.","4 e 11","https://ebible.org/porbr2018/1SA15.htm","O contexto é Saul e a ordem recebida por ele; a comparação com Joana é argumentativa."],["Heresia e reincidência","Tt 3,10-11","10 Ao homem rebelde, depois da primeira e da segunda repreensão, rejeita-o.\n11 Sabendo que o tal está pervertido, e está pecando, estando a si mesmo condenado.","Joana foi advertida várias vezes; a relapsia mostra obstinação.","12","https://ebible.org/pdf/porbr2018/porbr2018_TIT.pdf#page=5","A passagem trata de advertência e afastamento, não prescreve execução nem comprova relapsia no caso de Joana."]],"CR":[["1412","Nasce Joana em Domrémy."],["1429","Parte para Chinon; em 8/05 os ingleses levantam o cerco de Orléans; em 17/07, coroação de Carlos const sources=()=>`<div class="card"><h3>Fontes históricas e método</h3><p>${anchor(source1431,'Autos de 1431 — tradução de W. P. Barrett, 1932 (Fordham)')}. Consulte as sessões de 12 de maio (tortura), 24 de maio (abjuração) e 28–30 de maio (relapsia e sentença).</p><p>${anchor(source1456,'Depoimentos das investigações de 1452 e 1455–1456 — edição de T. Douglas Murray, 1902')}. Testemunhos de Manchon, Massieu, Houppeville e Isambard devem ser lidos como relatos retrospectivos, sujeitos a comparação.</p><p>${anchor('https://www.britannica.com/biography/Saint-Joan-of-Arc','Encyclopædia Britannica — síntese biográfica')}. Referência geral complementar.</p><p class="m">Sínteses e comentários redigidos para este projeto. Os 12 tópicos da Agenda são uma organização temática de estudo, não uma transcrição dos 12 artigos de 1431. Teses de debate não equivalem a conclusões históricas. As traduções modernas portuguesas das Escrituras servem à consulta; não são a Bíblia efetivamente usada pelo tribunal medieval.</p></div>`;

agenda:()=>`<h2>Agenda de estudo</h2><p class="m">12 temas para organizar o debate. As respostas são paráfrases didáticas, não citações literais dos autos.</p><div class="bar"><i style="width:${DATA.ART.filter((_,i)=>S.done[i]).length/12*100}%"></i></div>${DATA.ART.map((a,i)=>`<details class="${S.done[i]?'dn':''}"><summary><input type="checkbox" aria-label="Concluir tema ${i+1}" ${S.done[i]?'checked':''} onchange="S.done[${i}]=this.checked;save();rr()"><span class="ti"><b>Tema ${i+1}:</b> ${esc(a[0])}</span></summary><p><b>Contexto:</b> ${esc(a[1])}</p><p><b>Tese da acusação:</b> ${esc(a[2])}</p><p><b>Posição atribuída a Joana:</b> ${esc(a[3])}</p><p><b>Contraponto:</b> ${esc(DATA.CA[i][0])}</p><p><b>Réplica possível, a avaliar:</b> ${esc(DATA.CA[i][1])}</p><p class="m">A sentença de 1431 foi anulada em 1456. Compare a tese com os autos e com as condições do processo.</p><textarea aria-label="Anotações do tema ${i+1}" oninput="S.pn[${i}]=this.value;save()">${esc(S.pn[i]||'')}</textarea></details>`).join('')}<h3>Minha agenda</h3><div class="card"><input id="at" aria-label="Tópico" placeholder="Tópico"><textarea id="ab" aria-label="Detalhes do tópico" placeholder="Fatos, dúvidas e argumentos"></textarea><button onclick="add('agenda','at','ab')">Adicionar tópico</button></div>${S.agenda.map((a,i)=>`<div class="card"><label><input type="checkbox" ${a.ok?'checked':''} onchange="S.agenda[${i}].ok=this.checked;save()"> ${esc(a.t)}</label><textarea aria-label="Detalhes" oninput="S.agenda[${i}].n=this.value;save()">${esc(a.n)}</textarea><button class="x" onclick="removeItem('agenda',${i})">Apagar</button></div>`).join('')}`,

function results(key){const target=Q('#results-'+key);if(!target)return;let html='';const query=searches[key];
if(key==='bib'){const list=DATA.BIB.filter(b=>found(b.join(' '),query));html=`<p class="m">${list.length} referência(s)</p>`+list.map(b=>`<div class="card bib"><h3>${esc(b[1])}</h3><span class="m">${esc(b[0])} · Temas ${esc(b[4])}</span><p class="pg">${esc(b[2])}</p><p><b>Aplicação argumentativa:</b> ${esc(b[3])}</p><p><b>Limite:</b> ${esc(b[6])}</p>${anchor(b[5],'Conferir na fonte — BLIVRE')}</div>`).join('');}
if(key==='guia')html=DATA.G.d.filter(t=>found(t,query)).map(t=>{const [title,...rest]=t.split('\n\n');return `<details ${query?'open':''}><summary>${esc(title)}</summary><div class="pg">${esc(rest.join('\n\n'))}</div><p class="m">${anchor(source1431,'Processo de 1431')} · ${anchor(source1456,'Revisão e testemunhos')}</p></details>`;}).join('');
if(key==='dic')html=DATA.DIC.filter(t=>found(t.join(' '),query)).sort((a,b)=>a[0].localeCompare(b[0],'pt')).map(t=>card(t[0],t[2])).join('');

target.innerHTML=html||'<p class="m">Nenhum resultado.</p>';linkTerms(target);}
const termMap=new Map(DATA.DIC.map(d=>[nz(d[0]),d[0]]));
const termRegex=new RegExp('(?<![\\p{L}\\p{N}])('+DATA.DIC.map(d=>d[0]).sort((a,b)=>b.length-a.length).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')(?![\\p{L}\\p{N}])','giu');
function linkTerms(root){if(tab==='dic'||tab==='dom')return;const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(node){return node.parentElement.closest('a,button,input,textarea,select,svg,script,style')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);for(const node of nodes){const matches=[...node.data.matchAll(termRegex)];if(!matches.length)continue;const fragment=document.createDocumentFragment();let pos=0;for(const m of matches){fragment.append(node.data.slice(pos,m.index));const button=document.createElement('button');button.type='button';button.className='lk';button.textContent=m[0];button.title='Abrir no Dicionário';button.addEventListener('click',e=>{e.stopPropagation();searches.dic=termMap.get(nz(m[0]));go('dic');Q('#search-dic').focus();});fragment.append(button);pos=m.index+m[0].length;}fragment.append(node.data.slice(pos));node.replaceWith(fragment);}}
function go(next){tab=next;ed=null;draw();scrollTo(0,0);}
function draw(){Q('#nav').innerHTML=TABS.map(([k,n])=>`<button class="${tab===k?'on':''}" aria-current="${tab===k?'page':'false'}" onclick="go('${k}')">${icon(k)}<span>${n}</span></button>`).join('');Q('#m').innerHTML=V[tab]();if(tab in searches)results(tab);if(tab==='dom')dm();linkTerms(Q('#m'));}
function rr(){const y=scrollY;draw();scrollTo(0,y);}
function add(key,titleId,bodyId){const t=Q('#'+titleId).value.trim(),n=Q('#'+bodyId).value.trim();if(!t&&!n)return;S[key].unshift({t,n});save();rr();}
function removeItem(key,i){S[key].splice(i,1);save();rr();}
function saveNote(){const t=Q('#nt').value.trim(),n=Q('#nb').value.trim();if(!t&&!n)return;const note={t,n,d:new Date().toLocaleString('pt-BR')};if(ed===null)S.notes.unshift(note);else S.notes[ed]=note;ed=null;save();rr();}
function th(theme){S.th=theme==='light'?'light':'dark';document.documentElement.dataset.theme=S.th;Q('#th').textContent=S.th==='dark'?'Tema claro':'Tema escuro';save();}

let D=null;const PP=[[],[4],[0,8],[0,4,8],[0,2,6,8],[0,2,4,6,8],[0,2,3,5,6,8]];
const hf=(n,x,y)=>PP[n].map(k=>`<circle cx="${x+6+(k%3)*9}" cy="${y+6+((k/3)|0)*9}" r="2.5" fill="#222"/>`).join("");
function tsv(t,v,c){const r='fill="#f4efe3" stroke="#a9a28f"';return v?`<svg class="dt v ${c||""}" viewBox="0 0 30 60"><rect x="1" y="1" width="28" height="58" rx="5" ${r}/><path d="M4 30h22" stroke="#a9a28f"/>${hf(t[0],1,1)}${hf(t[1],1,31)}</svg>`:`<svg class="dt ${c||""}" viewBox="0 0 60 30"><rect x="1" y="1" width="58" height="28" rx="5" ${r}/><path d="M30 4v22" stroke="#a9a28f"/>${hf(t[0],1,1)}${hf(t[1],31,1)}</svg>`}
function dn(){const t=[];let id=0;for(let i=0;i<7;i++)for(let j=i;j<7;j++)t.push([i,j,id++]);t.sort(()=>Math.random()-.5);D={me:t.splice(0,7),pc:t.splice(0,7),st:t,bd:[],pk:null,ps:0,nw:-1,busy:false,msg:"Você começa: toque numa peça para jogar.",end:false}}
const ends=()=>D.bd.length?[D.bd[0][0],D.bd[D.bd.length-1][1]]:null;
const fits=t=>{const e=ends();if(!e)return["R"];const r=[];if(t[0]==e[0]||t[1]==e[0])r.push("L");if(t[0]==e[1]||t[1]==e[1])r.push("R");return r};
function put(t,s){const e=ends();D.nw=t[2];if(!e)D.bd.push(t);else if(s=="L")D.bd.unshift(t[1]==e[0]?t:[t[1],t[0],t[2]]);else D.bd.push(t[0]==e[1]?t:[t[1],t[0],t[2]])}
const pip=h=>h.reduce((a,t)=>a+t[0]+t[1],0);
function fin(){if(D.me.length&&D.pc.length&&D.ps<2)return false;D.end=true;D.busy=false;const a=pip(D.me),b=pip(D.pc);D.msg=!D.me.length?"Você ganhou!":!D.pc.length?"O computador ganhou.":a<b?"Jogo travado: você ganhou (menos pontos).":a>b?"Jogo travado: o computador ganhou.":"Jogo travado: empate.";return true}
function pcm(){let m=-1,s,b=-1,d=0;D.pc.forEach((t,i)=>fits(t).forEach(x=>{if(t[0]+t[1]>b){b=t[0]+t[1];m=i;s=x}}));while(m<0&&D.st.length){D.pc.push(D.st.pop());d++;const i=D.pc.length-1,f=fits(D.pc[i]);if(f.length){m=i;s=f[0]}}
if(m>=0){D.ps=0;put(D.pc.splice(m,1)[0],s)}else D.ps++;D.msg=(d?"O computador comprou "+d+". ":"")+(m>=0?"O computador jogou. Sua vez.":"O computador passou. Sua vez.");fin()}
function nx(){if(fin())return dm();D.busy=true;D.msg+=" O computador está pensando…";dm();setTimeout(()=>{pcm();D.busy=false;dm()},1300)}
function mine(i,s){if(D.busy||D.end)return;const f=fits(D.me[i]);if(!f.length)return;if(!s&&f.length>1){D.pk=i;D.msg="Escolha o lado: esquerda ou direita.";return dm()}put(D.me.splice(i,1)[0],s||f[0]);D.pk=null;D.ps=0;D.msg="Você jogou.";nx()}
function buy(){D.me.push(D.st.pop());D.msg="Você comprou uma peça.";dm()}
function pass(){D.ps++;D.msg="Você passou.";nx()}
function dm(){if(!Q("#dg"))return;const can=D.me.some(t=>fits(t).length),b=D.busy||D.end;Q("#dg").innerHTML=`<div class="felt"><div class="m">Computador: ${D.pc.map(()=>'<i class="bk"></i>').join("")} Monte: ${D.st.length}</div><div class="bd">${D.bd.map(t=>tsv(t,t[0]==t[1],t[2]==D.nw?"new":"")).join("")||'<span class="m">A mesa está vazia. Jogue a primeira peça.</span>'}</div></div><p><b>${D.msg}</b></p><div class="row hand">${D.me.map((t,i)=>`<button class="${!b&&fits(t).length?"can":""}" ${b?"disabled":""} onclick="mine(${i})" aria-label="Peça ${t[0]} e ${t[1]}">${tsv(t,true,D.pk==i?"sel":"")}</button>`).join("")}</div>`+(D.pk!=null?`<div class="row"><button onclick="mine(D.pk,'L')">Esquerda</button><button onclick="mine(D.pk,'R')">Direita</button></div>`:"")+(!b&&!can?(D.st.length?`<button class="pri" onclick="buy()">Comprar peça</button>`:`<button class="pri" onclick="pass()">Passar a vez</button>`):"")+`<div class="row"><button onclick="dn();dm()">Novo jogo</button></div>`}

th(S.th);draw();</script></body></html>
